name: ADR-0058 Apply and Verify

on:
  push:
    branches:
      - feat/adr-0058-entity-origin
    paths:
      - tools/apply_adr0058.py.gz.b64
      - .github/workflows/adr0058-apply.yml
      - tests/entity-origin-adr0058-test.cpp

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adr-0058-entity-origin
          fetch-depth: 0

      - name: Decode and apply ADR-0058 patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('tools/apply_adr0058.py.gz.b64').read_text().strip()
          Path('tools/apply_adr0058.py').write_bytes(
              gzip.decompress(base64.b64decode(encoded)))
          PY
          python3 tools/apply_adr0058.py
          rm -f tools/apply_adr0058.py tools/apply_adr0058.py.gz.b64
          rm -f .github/workflows/adr0058-apply.yml

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build focused tests
        run: cmake --build build --target entity_origin_adr0058_test sprite_pivot_adr0057_test -j 2

      - name: Run focused tests
        run: ctest --test-dir build --output-on-failure -R 'entity_origin_adr0058_test|sprite_pivot_adr0057_test'

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "ArtCade CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(editor): entity origin and collider-only geometry (ADR-0058)"
          git push origin HEAD:feat/adr-0058-entity-origin
