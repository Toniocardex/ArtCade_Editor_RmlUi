name: ADR-0058 Apply and Verify

on:
  push:
    branches:
      - feat/adr-0058-entity-origin
    paths:
      - tools/apply_adr0058.py.gz.b64
      - .github/workflows/adr0058-apply.yml
      - tests/entity-origin-adr0058-test.cpp
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adr-0058-entity-origin
          fetch-depth: 0

      - name: Decode and apply ADR-0058 patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path('tools/apply_adr0058.py.gz.b64').read_text().strip()
          patch = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          # Keep the forward-declaration anchor distinct from the friend entry.
          patch = patch.replace(
              'rep("src/editor-native/model/project_document.h",\n"class SetBoxColliderModeCommand;\\n",',
              'rep("src/editor-native/model/project_document.h",\n"\\nclass SetBoxColliderModeCommand;\\n",')
          patch = patch.replace(
              '"class SetBoxColliderModeCommand;\\nclass SetInstanceBoxColliderOffsetOverrideCommand;\\nclass SetInstanceOriginFromColliderAnchorCommand;\\n")',
              '"\\nclass SetBoxColliderModeCommand;\\nclass SetInstanceBoxColliderOffsetOverrideCommand;\\nclass SetInstanceOriginFromColliderAnchorCommand;\\n")')

          # Exact replacement remains the first choice. When the only drift is
          # indentation or line wrapping, accept one unique whitespace-flexible
          # match. Semantic or ambiguous drift still fails closed.
          old_rep = '''def rep(rel, old, new):
              text = read(rel)
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"{rel}: expected one occurrence, got {n}: {old[:100]!r}")
              write(rel, text.replace(old, new, 1))
          '''
          new_rep = '''def rep(rel, old, new):
              text = read(rel)
              n = text.count(old)
              if n == 1:
                  write(rel, text.replace(old, new, 1))
                  return
              pieces = re.split(r"(\\s+)", old)
              pattern = "".join(r"\\s+" if piece.isspace() else re.escape(piece)
                                for piece in pieces if piece)
              matches = list(re.finditer(pattern, text, flags=re.S))
              if len(matches) != 1:
                  raise RuntimeError(
                      f"{rel}: expected one occurrence, got exact={n}, fuzzy={len(matches)}: "
                      f"{old[:100]!r}")
              match = matches[0]
              write(rel, text[:match.start()] + new + text[match.end():])
          '''
          if old_rep not in patch:
              raise RuntimeError('ADR-0058 patch helper shape changed unexpectedly')
          patch = patch.replace(old_rep, new_rep, 1)

          Path('tools/apply_adr0058.py').write_text(patch, encoding='utf-8')
          PY
          python3 tools/apply_adr0058.py
          rm -f tools/apply_adr0058.py tools/apply_adr0058.py.gz.b64
          rm -f .github/workflows/adr0058-apply.yml

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build focused tests
        run: cmake --build build --target entity_origin_adr0058_test sprite_pivot_adr0057_test -j 2

      - name: Run focused tests
        run: ctest --test-dir build --output-on-failure -R 'entity_origin_adr0058_test|sprite_pivot_adr0057_test'

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "ArtCade CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(editor): entity origin and collider-only geometry (ADR-0058)"
          git push origin HEAD:feat/adr-0058-entity-origin
